name: Generate Release with PDF Report

on:
  push:
    branches:
      - '**'  # Trigger on push to any branch

jobs:
  generate_release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0 # Required to get the full commit history for the commit hash

      - name: Generate PDF
        uses: BaileyJM02/markdown-to-pdf@v1.2.0
        with:
          input_path: docs/report.md
          output_dir: docs/report.pdf

      - name: Get Commit Hash
        id: get_commit_hash
        run: |
          echo "COMMIT_HASH=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT

      - name: Bump version and push tag
        id: bump
        uses: anothrNick/github-tag-action@v1 # Don't use @master or @v1 unless you're happy to test the latest version
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # if you don't want to set write permissions use a PAT token
          WITH_V: false

      - name: Upload PDF to Release
        id: upload_release_asset
        uses: softprops/action-gh-release@v2.2.1
        with:
          body: |
            Release based on commit: ${{ steps.get_commit_hash.outputs.COMMIT_HASH }}
            Includes a PDF version of the `report.md` file.
          draft: false
          prerelease: false
          files: docs/report.pdf
          tag_name: ${{ env.GITDATE }}
